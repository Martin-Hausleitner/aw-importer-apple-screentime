<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Apple Screen Time to ActivityWatch importer flow</title>
  <desc id="desc">Apple iPhone Screen Time exports are parsed locally and written into ActivityWatch app usage buckets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#26324a"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop stop-color="#1f2a44"/><stop offset="1" stop-color="#243b55"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#8bd3ff"/></marker>
  </defs>
  <rect width="1200" height="520" rx="34" fill="url(#bg)"/>
  <text x="60" y="72" font-family="Inter, ui-sans-serif, system-ui" font-size="34" font-weight="800" fill="#f8fbff">Apple Screen Time → ActivityWatch</text>
  <text x="60" y="110" font-family="Inter, ui-sans-serif, system-ui" font-size="18" fill="#c8ddff">Local importer for iPhone app usage exports, designed for humans and AI agents.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="175" width="240" height="185" rx="24" fill="url(#card)" stroke="#8bd3ff" stroke-opacity=".55"/>
    <text x="100" y="225" font-size="28" font-family="Inter, ui-sans-serif" fill="#fff" font-weight="800">1. Export</text>
    <text x="100" y="263" font-size="17" font-family="Inter, ui-sans-serif" fill="#e5f4ff">CSV/JSON from Apple</text>
    <text x="100" y="288" font-size="17" font-family="Inter, ui-sans-serif" fill="#e5f4ff">Screen Time or helper</text>
    <text x="100" y="326" font-size="15" font-family="monospace" fill="#8bd3ff">app,start,duration</text>
    <rect x="372" y="175" width="240" height="185" rx="24" fill="url(#card)" stroke="#8bd3ff" stroke-opacity=".55"/>
    <text x="402" y="225" font-size="28" font-family="Inter, ui-sans-serif" fill="#fff" font-weight="800">2. Parse</text>
    <text x="402" y="263" font-size="17" font-family="Inter, ui-sans-serif" fill="#e5f4ff">Normalize app, device,</text>
    <text x="402" y="288" font-size="17" font-family="Inter, ui-sans-serif" fill="#e5f4ff">category, timestamps</text>
    <text x="402" y="313" font-size="17" font-family="Inter, ui-sans-serif" fill="#e5f4ff">and duration.</text>
    <rect x="674" y="175" width="240" height="185" rx="24" fill="url(#card)" stroke="#8bd3ff" stroke-opacity=".55"/>
    <text x="704" y="225" font-size="28" font-family="Inter, ui-sans-serif" fill="#fff" font-weight="800">3. Import</text>
    <text x="704" y="263" font-size="17" font-family="Inter, ui-sans-serif" fill="#e5f4ff">Write local AW events</text>
    <text x="704" y="288" font-size="17" font-family="Inter, ui-sans-serif" fill="#e5f4ff">into iOS Screen Time</text>
    <text x="704" y="313" font-size="17" font-family="Inter, ui-sans-serif" fill="#e5f4ff">buckets.</text>
    <rect x="976" y="175" width="155" height="185" rx="24" fill="url(#card)" stroke="#8bd3ff" stroke-opacity=".55"/>
    <text x="1005" y="225" font-size="28" font-family="Inter, ui-sans-serif" fill="#fff" font-weight="800">4. AW</text>
    <text x="1005" y="263" font-size="17" font-family="Inter, ui-sans-serif" fill="#e5f4ff">Timeline:</text>
    <text x="1005" y="292" font-size="15" font-family="monospace" fill="#8bd3ff">iPhone apps</text>
    <text x="1005" y="317" font-size="15" font-family="monospace" fill="#8bd3ff">categories</text>
    <text x="1005" y="342" font-size="15" font-family="monospace" fill="#8bd3ff">daily use</text>
  </g>
  <path d="M315 267h50" stroke="#8bd3ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M617 267h50" stroke="#8bd3ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M919 267h50" stroke="#8bd3ff" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="70" y="410" width="1060" height="54" rx="18" fill="#0b1220" stroke="#47688c"/>
  <text x="95" y="444" font-size="18" font-family="monospace" fill="#d9efff">aw-importer-apple-screentime import-file screen-time.csv --bucket aw-import-screentime_ios_manual</text>
</svg>
